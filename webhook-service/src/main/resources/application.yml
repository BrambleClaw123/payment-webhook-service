spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/webhook_db
    username: app
    password: app123
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: app
    password: app123
    listener:
      simple:
        default-requeue-rejected: false

app:
  rate-limit:
    enabled: true
    capacity: 10
    refill-per-second: 5
  sweeper:
    enabled: true
    interval-ms: 30000
    min-age-seconds: 60


management:
  endpoints:
    web:
      exposure:
        include: health