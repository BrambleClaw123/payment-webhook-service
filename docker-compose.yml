services:
  postgres:
    image: postgres:16
    container_name: pw-postgres
    environment:
      POSTGRES_DB: webhook_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pw-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pw-rabbitmq
    ports:
      - "5672:5672"     # cổng để app kết nối
      - "15672:15672"   # giao diện web quản lý
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app123

volumes:
  pgdata: